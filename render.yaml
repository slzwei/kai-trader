# Render Blueprint for Kai Trader.
# Single background worker; no inbound HTTP because the bot uses
# Telegram long-polling. To deploy: connect this repo to Render via
# https://dashboard.render.com/blueprints, then paste the secret env
# vars in the dashboard (everything marked sync: false).

services:
  - type: worker
    name: kai-trader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    autoDeploy: true
    envVars:
      # Non-secret defaults baked into the manifest.
      - key: ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: TIMEZONE
        value: Asia/Singapore
      - key: ALPACA_PAPER
        value: "true"
      # Phase A1: AI decision layer governs new CSP entries. Flip to
      # "off" to restore pure deterministic selection; every AI failure
      # already fails closed for new entries either way.
      - key: AI_DECISION_MODE
        value: "filter"
      # Secrets: set in the Render dashboard, never committed.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DATABASE_URL_RO
        sync: false

  # Phase D1: read-only web dashboard. Free tier (spins down when idle;
  # first visit after a quiet spell takes a few seconds to wake). Same
  # Docker image as the bot, different start command. Holds ONLY the
  # read-only DSN and the page token: no broker keys, no Telegram
  # token, no write-capable DB credentials.
  - type: web
    name: kai-trader-dashboard
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uv run python -m kai_trader.dashboard.main
    plan: free
    region: singapore
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL_RO
        sync: false
      - key: DASHBOARD_TOKEN
        generateValue: true
